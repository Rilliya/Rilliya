name: Rilliya

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "26.3"
  projectFormat: xcode16_3
  defaultConfig: Debug
  deploymentTarget:
    macOS: "14.2"

packages:
  RilliyaKit:
    path: ../RilliyaKit
  FlowingDayUI:
    url: https://github.com/cocoa-xu/flowing-day-ui.git
    from: 2.5.0

settings:
  base:
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  RilliyaVirtualAudioDriver:
    type: bundle
    platform: macOS
    sources:
      - path: Driver/Sources
    info:
      path: Driver/Resources/Info.plist
      properties:
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFPlugInFactories:
          961AA42D-4018-4A54-81A5-AF308770CF08: RilliyaVirtualAudioDriverFactory
        CFPlugInTypes:
          443ABAB8-E7B3-491A-B985-BEB9187030DB:
            - 961AA42D-4018-4A54-81A5-AF308770CF08
    settings:
      base:
        CODE_SIGN_IDENTITY: "${CODE_SIGN_IDENTITY}"
        CODE_SIGN_STYLE: Manual
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_ENABLE_OBJC_ARC: YES
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INSTALL_PATH: /Library/Audio/Plug-Ins/HAL
        MACH_O_TYPE: mh_bundle
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: moe.uwucocoa.rilliya.virtual-audio-driver
        PRODUCT_NAME: RilliyaVirtualAudioDriver
        SKIP_INSTALL: NO
        WRAPPER_EXTENSION: driver
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          COPY_PHASE_STRIP: YES
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          LLVM_LTO: YES_THIN
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework

  Rilliya:
    type: application
    platform: macOS
    sources:
      - path: Sources/Rilliya
        excludes:
          - Resources/Info.plist
          - Resources/Rilliya.entitlements
    info:
      path: Sources/Rilliya/Resources/Info.plist
      properties:
        CFBundleDisplayName: Rilliya
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSAudioCaptureUsageDescription: Rilliya captures selected application audio and output-device mixes so you can monitor and route their channels.
        NSLocalNetworkUsageDescription: Rilliya sends and receives realtime audio only when you add and run a Network Audio node.
        NSMicrophoneUsageDescription: Rilliya accesses audio input devices so you can monitor and route their channels.
    entitlements:
      path: Sources/Rilliya/Resources/Rilliya.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        CODE_SIGN_IDENTITY: "${CODE_SIGN_IDENTITY}"
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: moe.uwucocoa.rilliya
        PRODUCT_NAME: Rilliya
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          COPY_PHASE_STRIP: YES
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          LLVM_LTO: YES_THIN
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
    dependencies:
      - package: RilliyaKit
        product: RilliyaKit
      - package: FlowingDayUI
        product: FlowingDayControls
      - package: FlowingDayUI
        product: FlowingDayCanvas
      - package: FlowingDayUI
        product: FlowingDayGraphCore
      - package: FlowingDayUI
        product: FlowingDayGraphComposition
      - package: FlowingDayUI
        product: FlowingDayGraphLayout
      - package: FlowingDayUI
        product: FlowingDayGraphCanvas
      - package: FlowingDayUI
        product: FlowingDayPreferences

  RilliyaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/RilliyaTests
    settings:
      base:
        CODE_SIGN_IDENTITY: "${CODE_SIGN_IDENTITY}"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: moe.uwucocoa.rilliyaTests
    dependencies:
      - target: Rilliya

schemes:
  Rilliya:
    build:
      targets:
        RilliyaVirtualAudioDriver: all
        Rilliya: all
        RilliyaTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: RilliyaTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
