name: Rilliya

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "26.3"
  projectFormat: xcode16_3
  defaultConfig: Debug
  deploymentTarget:
    macOS: "14.2"

packages:
  RilliyaKit:
    url: https://github.com/Rilliya/RilliyaKit.git
    exactVersion: 0.2.0-alpha.1
  FlowingDayUI:
    url: https://github.com/cocoa-xu/flowing-day-ui.git
    exactVersion: 2.5.1

settings:
  base:
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Rilliya:
    type: application
    platform: macOS
    sources:
      - path: Sources/Rilliya
        excludes:
          - Resources/AppIcon.icon
          - Resources/Assets.xcassets
          - Resources/GeneratedAppAssets
          - Resources/Info.plist
          - Resources/Rilliya.entitlements
      - path: Sources/Rilliya/Resources/GeneratedAppAssets/Assets.car
      - path: Sources/Rilliya/Resources/GeneratedAppAssets/AppIcon.icns
    info:
      path: Sources/Rilliya/Resources/Info.plist
      properties:
        CFBundleDisplayName: Rilliya
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSAudioCaptureUsageDescription: Rilliya captures selected application audio and output-device mixes so you can monitor and route their channels.
        NSLocalNetworkUsageDescription: Rilliya sends and receives realtime audio only when you add and run a Network Audio node.
        NSMicrophoneUsageDescription: Rilliya accesses audio input devices so you can monitor and route their channels.
    entitlements:
      path: Sources/Rilliya/Resources/Rilliya.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_IDENTITY: "${CODE_SIGN_IDENTITY}"
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0-alpha.1
        PRODUCT_BUNDLE_IDENTIFIER: moe.uwucocoa.rilliya
        PRODUCT_NAME: Rilliya
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          COPY_PHASE_STRIP: YES
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          LLVM_LTO: YES_THIN
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
    dependencies:
      - package: RilliyaKit
        product: RilliyaKit
      - package: FlowingDayUI
        product: FlowingDayControls
      - package: FlowingDayUI
        product: FlowingDayCanvas
      - package: FlowingDayUI
        product: FlowingDayGraphCore
      - package: FlowingDayUI
        product: FlowingDayGraphComposition
      - package: FlowingDayUI
        product: FlowingDayGraphLayout
      - package: FlowingDayUI
        product: FlowingDayGraphCanvas
      - package: FlowingDayUI
        product: FlowingDayPreferences

  RilliyaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/RilliyaTests
    settings:
      base:
        CODE_SIGN_IDENTITY: "${CODE_SIGN_IDENTITY}"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: moe.uwucocoa.rilliyaTests
    dependencies:
      - target: Rilliya

schemes:
  Rilliya:
    build:
      targets:
        Rilliya: all
        RilliyaTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: RilliyaTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
